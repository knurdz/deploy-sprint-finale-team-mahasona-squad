name: Blue-Green Release

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed
    branches:
      - main

permissions:
  contents: read

jobs:
  blue-green-release:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success'
      )
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: team-site/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: team-site

      - name: Build site
        env:
          VITE_PUBLIC_URL: ${{ vars.PUBLIC_URL || vars.DOMAIN_PUBLIC_URL || secrets.PUBLIC_URL || vars.IP_PUBLIC_URL }}
          VITE_WEB3FORMS_ACCESS_KEY: ${{ secrets.WEB3FORMS_ACCESS_KEY }}
        run: npm run build
        working-directory: team-site

      - name: Run blue-green deployment
        env:
          RELEASE_NAME: release-${{ github.run_id }}
        run: |
          chmod +x .github/scripts/blue-green-release.sh
          ./.github/scripts/blue-green-release.sh "$GITHUB_WORKSPACE/.releases" "$GITHUB_WORKSPACE/team-site/dist"

      - name: Upload release evidence
        uses: actions/upload-artifact@v4
        with:
          name: blue-green-release-${{ github.run_id }}
          path: |
            .releases/release-manifest.json
            team-site/dist/status
