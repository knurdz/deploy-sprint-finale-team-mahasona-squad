name: Request Organizer Deploy

on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: request-organizer-deploy
  cancel-in-progress: false

jobs:
  request-deploy:
    name: Request deployer publish
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.workflow_run.conclusion == 'success' &&
        !contains(github.event.workflow_run.head_commit.message, '[skip deploy]')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Resolve deploy request
        id: request
        env:
          EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          WORKFLOW_RUN_BRANCH: ${{ github.event.workflow_run.head_branch }}
          WORKFLOW_RUN_ID: ${{ github.event.workflow_run.id }}
          MANUAL_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            sha="$MANUAL_SHA"
            branch="main"
            
            echo "Querying CI workflow run for SHA: $sha..."
            source_run_id=$(gh run list \
              --workflow "CI" \
              --commit "$sha" \
              --status "success" \
              --limit 1 \
              --json databaseId \
              --jq '.[0].databaseId')
            
            if [ -z "$source_run_id" ] || [ "$source_run_id" = "null" ]; then
              echo "Error: No successful CI run found for commit $sha. Please ensure CI has run successfully before deploying."
              exit 1
            fi
            echo "Found CI workflow run ID: $source_run_id"
          else
            sha="$WORKFLOW_RUN_SHA"
            branch="$WORKFLOW_RUN_BRANCH"
            source_run_id="$WORKFLOW_RUN_ID"
          fi

          if [ "$branch" != "main" ]; then
            echo "Only main branch deploy requests are allowed. Got: $branch"
            exit 1
          fi

          {
            echo "sha=$sha"
            echo "branch=$branch"
            echo "source_run_id=$source_run_id"
          } >> "$GITHUB_OUTPUT"

      - name: Request deploy from organizer deployer
        env:
          DEPLOYER_DISPATCH_TOKEN: ${{ secrets.DEPLOYER_DISPATCH_TOKEN }}
          DEPLOYER_REPO: ${{ vars.DEPLOYER_REPO || 'knurdz/deploy-sprint-deployer' }}
          TEAM_REPO: ${{ github.repository }}
          TEAM_SHA: ${{ steps.request.outputs.sha }}
          TEAM_BRANCH: ${{ steps.request.outputs.branch }}
          SOURCE_RUN_ID: ${{ steps.request.outputs.source_run_id }}
          TEAM_SLUG: ${{ vars.TEAM_SLUG || 'placeholder-team-slug' }}
        run: |
          set -euo pipefail

          if [ -z "$DEPLOYER_DISPATCH_TOKEN" ]; then
            echo "DEPLOYER_DISPATCH_TOKEN is not configured."
            exit 1
          fi

          python3 - <<'PY' > payload.json
          import json
          import os

          team_slug = os.environ.get("TEAM_SLUG", "placeholder-team-slug")
          payload = {
              "event_type": f"team-{team_slug}-main-merged",
              "client_payload": {
                  "team": team_slug,
                  "repo": os.environ["TEAM_REPO"],
                  "sha": os.environ["TEAM_SHA"],
                  "branch": os.environ["TEAM_BRANCH"],
                  "source_run_id": os.environ["SOURCE_RUN_ID"],
              },
          }

          print(json.dumps(payload))
          PY

          curl --fail-with-body --show-error --silent \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${DEPLOYER_DISPATCH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${DEPLOYER_REPO}/dispatches" \
            --data @payload.json

          echo "Requested organizer deployment for ${TEAM_REPO}@${TEAM_SHA}."
