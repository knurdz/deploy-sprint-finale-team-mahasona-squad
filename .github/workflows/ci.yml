name: CI

on:
  pull_request:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Cache npm dependencies
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('team-site/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Install dependencies
        run: npm ci
        working-directory: team-site

      - name: Build
        env:
          VITE_PUBLIC_URL: ${{ vars.PUBLIC_URL || vars.DOMAIN_PUBLIC_URL || secrets.PUBLIC_URL || vars.IP_PUBLIC_URL }}
          VITE_FEATURE_SHOW_INSIGHTS: ${{ secrets.FEATURE_SHOW_INSIGHTS || vars.FEATURE_SHOW_INSIGHTS || 'false' }}
        run: npm run build
        working-directory: team-site

      - name: Write safe status evidence
        env:
          TEAM_SLUG: ${{ vars.TEAM_SLUG || 'placeholder-team-slug' }}
          FEATURE_SHOW_INSIGHTS: ${{ secrets.FEATURE_SHOW_INSIGHTS || vars.FEATURE_SHOW_INSIGHTS || 'false' }}
        run: |
          mkdir -p team-site/dist/status team-site/dist/health
          printf 'ok' > team-site/dist/health/index.html
          DEPLOY_TIME=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          IS_ENABLED="false"
          if [ "$FEATURE_SHOW_INSIGHTS" = "true" ] || [ "$FEATURE_SHOW_INSIGHTS" = "1" ]; then
            IS_ENABLED="true"
          fi
          printf '{"team":"%s","commit":"%s","release":"%s","deploy_time":"%s","marker":"T07","feature_flag":{"name":"FEATURE_SHOW_INSIGHTS","enabled":%s},"FEATURE_SHOW_INSIGHTS":%s}' "$TEAM_SLUG" "$GITHUB_SHA" "$GITHUB_RUN_ID" "$DEPLOY_TIME" "$IS_ENABLED" "$IS_ENABLED" > team-site/dist/status/index.html
          cp team-site/server.js team-site/dist/
          cp team-site/package.json team-site/dist/

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.sha }}
          path: team-site/dist

      - name: Generate Workflow Summary & Cache Evidence
        run: |
          echo "## 🚀 CI Build & Cache Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Status:** Build Succeeded ✅" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit SHA:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Dependency Cache Key Source:** \`team-site/package-lock.json\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Install Command:** \`npm ci\` (Deterministic Lockfile Install)" >> $GITHUB_STEP_SUMMARY
          echo "- **Production Deployment:** Isolated (main branch only)" >> $GITHUB_STEP_SUMMARY

