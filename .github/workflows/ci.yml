name: CI

on:
  pull_request:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: team-site/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: team-site

      - name: Build
        env:
          VITE_PUBLIC_URL: ${{ vars.PUBLIC_URL || vars.DOMAIN_PUBLIC_URL || secrets.PUBLIC_URL || vars.IP_PUBLIC_URL }}
        run: npm run build
        working-directory: team-site

      - name: Write safe status evidence
        env:
          TEAM_SLUG: ${{ vars.TEAM_SLUG || 'placeholder-team-slug' }}
        run: |
          mkdir -p team-site/dist/status team-site/dist/health
          printf 'ok' > team-site/dist/health/index.html
          DEPLOY_TIME=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          printf '{"team":"%s","commit":"%s","release":"%s","deploy_time":"%s","marker":"T07"}' "$TEAM_SLUG" "$GITHUB_SHA" "$GITHUB_RUN_ID" "$DEPLOY_TIME" > team-site/dist/status/index.html
          cp team-site/server.js team-site/dist/
          cp team-site/package.json team-site/dist/

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.sha }}
          path: team-site/dist
